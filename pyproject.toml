[project]
name = "recipe-scrapers-webservice"
version = "1.22.1"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
# Poetry only locks a dependency that supports this whole range, so keep it at the Python of the
# Docker image. Renovate never updates it: when an update fails with "requires Python >=X",
# raise it here (and in the Dockerfile if X is newer than the image).
requires-python = ">=3.13"
dependencies = [
    "flask (==3.1.3)",
    "recipe-scrapers (==15.13.0)",
    "gunicorn (==27.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "9.2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
